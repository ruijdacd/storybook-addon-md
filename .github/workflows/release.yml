name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: nubjs/setup-nub@v0.5.0
        with:
          node-version: 24
          nub-version: 0.7.5
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11
      - run: nub install --frozen-lockfile
      - uses: changesets/action@v2.1.2
        with:
          version-script: nub run version-packages
          publish-script: nub run release
          pr-base-branch: main
          commit-message: 'chore: release package'
          pr-title: 'chore: release package'
