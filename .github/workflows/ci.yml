name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0.5.0
        with:
          node-version: 24
          nub-version: 0.7.5
      - run: nub install --frozen-lockfile
      - run: nub exec playwright install --with-deps chromium
      - run: nub run check
      - run: nub run lint
      - run: nub run format:check
      - run: nub audit --audit-level=high
      - run: nub run test
      - run: nub run test:browser
      - run: nub run test:e2e
      - run: nub run test:package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
