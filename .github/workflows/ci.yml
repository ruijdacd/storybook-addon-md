name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !inputs.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0.5.0
        with:
          node-version: 24
          nub-version: 0.7.5
      - run: nub install --frozen-lockfile
      - run: nub run check
      - run: nub run lint
      - run: nub run format:check
      - run: nub audit --audit-level=high
      - run: nub run test
      - run: nub run test:browser
      - run: nub run test:e2e
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      - run: nub run test:package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chrome, workers: 2, trace: retain-on-failure }
          - { browser: chrome, workers: 3, trace: retain-on-failure }
          - { browser: chrome, workers: 4, trace: retain-on-failure }
          - { browser: chrome, workers: 4, trace: 'off' }
          - { browser: shell, workers: 2, trace: retain-on-failure }
          - { browser: shell, workers: 4, trace: retain-on-failure }
    env:
      PLAYWRIGHT_CHANNEL: ${{ matrix.browser == 'chrome' && 'chrome' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0.5.0
        with:
          node-version: 24
          nub-version: 0.7.5
      - run: nub install --frozen-lockfile
      - if: matrix.browser == 'shell'
        run: nub exec playwright install --with-deps --only-shell chromium
      - run: node -e 'console.log({cpus:require("node:os").availableParallelism(),memory:require("node:os").totalmem()})'
      - run: nub exec playwright test --workers=${{ matrix.workers }} --trace=${{ matrix.trace }} --repeat-each=3 --global-timeout=600000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.browser }}-${{ matrix.workers }}-${{ matrix.trace }}
          path: |
            playwright-report/
            test-results/
